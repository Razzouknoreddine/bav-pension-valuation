[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bavpension"
version = "1.0.0"
description = "Bewertung von Pensionsrückstellungen: Teilwertverfahren (Steuerbilanz) vs. Projected-Unit-Credit-Methode (HGB/IFRS)"
authors = [{ name = "Noreddine Razzouk" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
data = ["openpyxl>=3.1"]   # nur für scripts/prepare_data.py

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
